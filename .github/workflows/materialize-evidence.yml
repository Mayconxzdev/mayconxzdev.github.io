name: Materialize recruiter evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-evidence.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore validated WebP evidence blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/evidence

          fetch_blob() {
            local sha="$1"
            local output="$2"
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | python -c 'import json,sys,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
              > "$output"
            python - "$output" <<'PY'
import pathlib, sys
p = pathlib.Path(sys.argv[1])
b = p.read_bytes()
if len(b) < 1000 or b[:4] != b'RIFF' or b[8:12] != b'WEBP':
    raise SystemExit(f'{p} is not a valid WebP payload')
print(f'validated {p}: {len(b)} bytes')
PY
          }

          fetch_blob '257335feb13447407f8047056ea2d5f1da33cab3' 'assets/evidence/carreira-overview.webp'
          fetch_blob '79282ddd5d98b2d2bc754463609954108810be26' 'assets/evidence/central-iso-overview.webp'

      - name: Commit visual evidence and repository cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-files 'node_modules/**' | grep -q .; then
            git rm -r --cached node_modules
          fi

          git add assets/evidence/carreira-overview.webp assets/evidence/central-iso-overview.webp .gitignore

          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'chore: add recruiter evidence and clean tracked dependencies'
            git push origin HEAD:main
          fi
