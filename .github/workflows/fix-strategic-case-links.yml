name: Fix strategic case links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-strategic-case-links.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix English case links and commit if needed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for name in ['en/cases/career-personal/index.html', 'en/cases/central-iso/index.html']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('href="../../assets/cv/', 'href="../../../assets/cv/')
              path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/cases/career-personal/index.html en/cases/central-iso/index.html
          if git diff --cached --quiet; then
            echo 'Links already correct.'
          else
            git commit -m 'fix: correct English case resume links'
            git push origin HEAD:main
          fi
