name: Finalize portfolio source and pipeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-site-pipeline.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare tooling
        run: python -m pip install beautifulsoup4 reportlab pypdf

      - name: Materialize any still-pending legacy transformations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
from pathlib import Path
import re, subprocess

index = Path('index.html').read_text(encoding='utf-8')
if 'portfolio-proof' in index and 'CarreiraPessoal' in index:
    print('Main source already carries the recruiter-facing materialized state.')
    raise SystemExit(0)

workflow = Path('.github/workflows/pages.yml').read_text(encoding='utf-8')
allowed = re.compile(r'^\s*python\s+scripts/(?:add_|apply_|final_|normalize_|patch_|reconcile_|rewrite_)[A-Za-z0-9_.-]+\.py(?:\s+.*)?$')
commands=[]
for raw in workflow.splitlines():
    if allowed.match(raw):
        cmd=raw.strip()
        if 'validate_' in cmd or 'generate_' in cmd:
            continue
        if cmd not in commands:
            commands.append(cmd)
for cmd in commands:
    print('+', cmd)
    subprocess.run(cmd, shell=True, check=True)
PY

      - name: Ensure current recruiter-facing links and real evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets/evidence

          fetch_blob() {
            local sha="$1"; local output="$2"
            if [ -f "$output" ]; then return 0; fi
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | python -c 'import json,sys,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' > "$output"
            python - "$output" <<'PY'
import pathlib,sys
p=pathlib.Path(sys.argv[1]); b=p.read_bytes()
if len(b)<1000 or b[:4]!=b'RIFF' or b[8:12]!=b'WEBP':
    raise SystemExit(f'{p} is not a valid WebP')
print(f'validated {p}: {len(b)} bytes')
PY
          }

          fetch_blob '257335feb13447407f8047056ea2d5f1da33cab3' 'assets/evidence/carreira-overview.webp'
          fetch_blob '79282ddd5d98b2d2bc754463609954108810be26' 'assets/evidence/central-iso-overview.webp'

          python - <<'PY'
from pathlib import Path
from bs4 import BeautifulSoup


def refresh(path, *, english=False):
    p=Path(path)
    soup=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')
    article=None
    for h in soup.find_all(['h2','h3','strong']):
        if 'CarreiraPessoal' in h.get_text(' ',strip=True):
            article=h.find_parent('article')
            if article: break
    if article:
        for a in article.find_all('a'):
            t=a.get_text(' ',strip=True).lower()
            if ('case' in t or 'projeto' in t or 'project' in t) and 'código' not in t and 'code' not in t:
                a['href']='cases/career-personal/' if english else 'cases/carreira-pessoal/'
                break
        visual=article.find(class_='feature-case__visual')
        if visual:
            visual.clear()
            fig=soup.new_tag('figure'); fig['class']=['portfolio-proof']
            img=soup.new_tag('img'); img['src']='../assets/evidence/carreira-overview.webp' if english else 'assets/evidence/carreira-overview.webp'; img['alt']='Real CarreiraPessoal screens' if english else 'Telas reais do CarreiraPessoal'; img['loading']='lazy'; fig.append(img)
            cap=soup.new_tag('figcaption'); cap.string='Real v12.5.2 product screens.' if english else 'Telas reais da v12.5.2.'; fig.append(cap); visual.append(fig)
    for node in soup.find_all(string=lambda s:isinstance(s,str) and 'Central ISO' in s):
        a=node.find_parent('a')
        if a:
            a['href']='cases/central-iso/'
            break
    p.write_text(str(soup),encoding='utf-8')

refresh('index.html',english=False)
refresh('en/index.html',english=True)

css=Path('css/layout-safety.css'); text=css.read_text(encoding='utf-8')
block='''\n/* Real product evidence used in flagship cards. */\n.portfolio-proof{margin:0;width:100%;display:grid;gap:.55rem}.portfolio-proof img{display:block;width:100%;height:auto;border-radius:16px;border:1px solid rgba(127,127,127,.22);box-shadow:0 18px 54px rgba(0,0,0,.10)}.portfolio-proof figcaption{font-size:.76rem;line-height:1.4;opacity:.72}\n'''
if 'Real product evidence used in flagship cards.' not in text:
    css.write_text(text+block,encoding='utf-8')
PY

      - name: Regenerate and validate current resumes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_resumes_general.py
          python scripts/validate_general_resumes.py

      - name: Replace legacy patch-chain deploy with clean validation/deploy pipeline
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/pages.yml <<'YAML'
name: Portfolio Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab pypdf
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Generate canonical resumes
        run: python scripts/generate_resumes_general.py

      - name: Validate source, resumes and JavaScript
        run: |
          python -m compileall -q scripts
          python scripts/validate_general_resumes.py
          python scripts/validate_site.py
          node --check js/site.js

      - name: Visual smoke — desktop/mobile and light/dark
        shell: bash
        run: |
          python -m http.server 4173 >/tmp/portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node scripts/visual_smoke.mjs http://127.0.0.1:4173 artifacts/visual

      - name: Build clean Pages artifact
        shell: bash
        run: |
          rm -rf .site
          mkdir .site
          rsync -a ./ .site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude 'node_modules/' \
            --exclude 'scripts/' \
            --exclude 'docs/' \
            --exclude 'artifacts/' \
            --exclude '*.pyc' \
            --exclude '__pycache__/'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site

  deploy:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify public routes
        shell: bash
        run: |
          set -euo pipefail
          retry() { for i in 1 2 3 4 5 6; do if curl -fsSL "$1" -o "$2"; then return 0; fi; sleep 10; done; return 1; }
          retry 'https://mayconxzdev.github.io/' /tmp/home.html
          retry 'https://mayconxzdev.github.io/cases/carreira-pessoal/' /tmp/carreira.html
          retry 'https://mayconxzdev.github.io/cases/central-iso/' /tmp/iso.html
          retry 'https://mayconxzdev.github.io/assets/cv/Maycon_Ferreira_Analista_Automacao_IA_Integracoes.pdf' /tmp/cv.pdf
          grep -q 'CarreiraPessoal' /tmp/home.html
          grep -q '283' /tmp/carreira.html
          grep -q 'piloto técnico' /tmp/iso.html
          test "$(wc -c </tmp/cv.pdf)" -gt 5000
YAML

      - name: Remove obsolete transformation scripts and tracked local dependencies
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files 'node_modules/**' | grep -q .; then
            git rm -r --cached node_modules
          fi
          for f in \
            scripts/add_carreirapessoal_home.py \
            scripts/apply_verified_career_facts_v2.py \
            scripts/final_quality_patch.py \
            scripts/final_text_patch.py \
            scripts/normalize_canonical_routes.py \
            scripts/normalize_portfolio_content.py \
            scripts/patch_home_core.py \
            scripts/patch_maintenance_case.py \
            scripts/patch_portfolio_consistency.py \
            scripts/patch_proposal_case_en.py \
            scripts/patch_proposal_case_pt.py \
            scripts/patch_skills_current.py \
            scripts/reconcile_public_cases.py \
            scripts/rewrite_public_voice.py; do
            [ -f "$f" ] && git rm "$f" || true
          done

          for f in \
            .github/workflows/repository-hygiene.yml \
            .github/workflows/materialize-evidence.yml \
            .github/workflows/materialize-resumes.yml \
            .github/workflows/materialize-site-source.yml \
            .github/workflows/finalize-site-pipeline.yml; do
            [ -f "$f" ] && git rm "$f" || true
          done

      - name: Commit canonical source and clean pipeline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
          else
            git commit -m 'refactor: make portfolio source canonical and remove patch chain'
            git push origin HEAD:main
          fi
