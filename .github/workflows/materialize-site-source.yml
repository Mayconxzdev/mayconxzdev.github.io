name: Materialize current portfolio source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-site-source.yml'
      - 'scripts/materialize_portfolio_source.py'
      - 'scripts/add_*.py'
      - 'scripts/apply_*.py'
      - 'scripts/final_*.py'
      - 'scripts/normalize_*.py'
      - 'scripts/patch_*.py'
      - 'scripts/reconcile_*.py'
      - 'scripts/rewrite_*.py'

permissions:
  contents: write

concurrency:
  group: materialize-portfolio-source-main
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Materialize recruiter-facing portfolio source
        run: python scripts/materialize_portfolio_source.py

      - name: Commit materialized source when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'Source is already materialized.'
          else
            git commit -m 'refactor: materialize portfolio source and recruiter evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
