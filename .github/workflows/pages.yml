name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install resume and visual-validation dependencies
        run: python -m pip install --disable-pip-version-check reportlab==4.4.9 pypdf==5.9.0 pymupdf==1.26.7
      - name: Validate source syntax
        run: python -m compileall -q scripts
      - name: Generate current general resumes
        run: |
          python scripts/generate_resumes_general.py
          python scripts/add_resume_links.py
      - name: Apply current portfolio evidence and shared chrome
        run: |
          python scripts/add_carreirapessoal_home.py
          python scripts/patch_career_visual.py
          python scripts/patch_skills_current.py
          python scripts/patch_portfolio_consistency.py
          python scripts/normalize_site_chrome.py
      - name: Validate current resume content, links, ATS text and visual layout
        run: |
          python scripts/validate_general_resumes.py
          python scripts/validate_resume_visual.py
      - name: Validate every canonical page, local reference and referenced visual
        run: python scripts/validate_site.py
      - name: Validate JavaScript syntax
        run: node --check js/site.js && node --check scripts/visual_smoke.mjs
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run full portfolio browser and visual smoke
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ >/dev/null
          node scripts/visual_smoke.mjs http://127.0.0.1:8000 artifacts/visual
      - name: Upload audited resumes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-resumes-${{ github.run_id }}
          path: assets/cv/*.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Upload full visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa-${{ github.run_id }}
          path: artifacts/visual/
          if-no-files-found: warn
          retention-days: 14
      - name: Build clean Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          rm -rf .site
          mkdir .site
          cp -r index.html 404.html assets cases competencias en css js robots.txt sitemap.xml .nojekyll .site/
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload validated site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm current portfolio, shared chrome and career visual are live
        shell: bash
        run: |
          for attempt in {1..30}; do
            HOME_HTML="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://mayconxzdev.github.io/?build=${GITHUB_SHA}&attempt=${attempt}" || true)"
            CAREER_HTML="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://mayconxzdev.github.io/cases/carreira-pessoal/?build=${GITHUB_SHA}&attempt=${attempt}" || true)"
            PROD_HTML="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://mayconxzdev.github.io/cases/producao-operacional/?build=${GITHUB_SHA}&attempt=${attempt}" || true)"
            ISO_HTML="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://mayconxzdev.github.io/cases/central-iso/?build=${GITHUB_SHA}&attempt=${attempt}" || true)"
            CAREER_IMAGE="$(curl -fsSI --max-time 20 "https://mayconxzdev.github.io/assets/evidence/carreira-product-overview.svg?build=${GITHUB_SHA}" | head -n 1 || true)"
            if grep -Fq "RESULTADOS EM USO" <<<"$HOME_HTML" \
              && grep -Fq 'data-global-chrome="2026-08"' <<<"$HOME_HTML" \
              && grep -Fq 'data-global-chrome="2026-08"' <<<"$CAREER_HTML" \
              && grep -Fq 'data-global-chrome="2026-08"' <<<"$PROD_HTML" \
              && grep -Fq 'data-global-chrome="2026-08"' <<<"$ISO_HTML" \
              && grep -Fq "Mapa visual sanitizado" <<<"$CAREER_HTML" \
              && grep -Fq "200" <<<"$CAREER_IMAGE"; then
              echo "Published portfolio, cases, shared chrome and visual evidence match the current build."
              exit 0
            fi
            echo "Published content is not current yet (attempt ${attempt}/30)."
            sleep 10
          done
          echo "The Pages deployment completed, but the public URL did not expose the current portfolio within the verification window."
          exit 1
