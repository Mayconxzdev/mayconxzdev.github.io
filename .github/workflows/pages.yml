name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install resume and visual-validation dependencies
        run: python -m pip install --disable-pip-version-check reportlab==4.4.9 pypdf==5.9.0 pymupdf==1.26.7
      - name: Validate source syntax
        run: python -m compileall -q scripts
      - name: Generate current recruiter-facing artifacts
        run: |
          python scripts/generate_resumes_general.py
          python scripts/add_resume_links.py
          python scripts/generate_social_cover.py
      - name: Apply current portfolio evidence and shared chrome
        run: |
          python scripts/add_carreirapessoal_home.py
          python scripts/patch_career_visual.py
          python scripts/patch_skills_current.py
          python scripts/patch_portfolio_consistency.py
          python scripts/patch_case_visual_safety.py
          python scripts/normalize_site_chrome.py
          python scripts/patch_navigation_targets.py
          python scripts/patch_404_language.py
          python scripts/normalize_case_sequence.py
          python scripts/patch_recruiter_archive.py
          # Run idempotent materializers twice intentionally so a future merge cannot
          # duplicate recruiter-facing labels, controls or skill copy.
          python scripts/patch_skills_current.py
          python scripts/patch_recruiter_archive.py
      - name: Validate current resume content, links, ATS text and visual layout
        run: |
          python scripts/validate_general_resumes.py
          python scripts/validate_resume_visual.py
      - name: Validate every canonical page, local reference, shared layout and referenced visual
        run: |
          python scripts/validate_site.py
          python scripts/validate_navigation_targets.py
          python scripts/validate_editorial_consistency.py
          python scripts/validate_case_visual_consistency.py
          python scripts/validate_case_sequence.py
          python scripts/performance_budget.py
      - name: Validate JavaScript syntax
        run: |
          node --check js/site.js
          node --check js/recruiter-audit.js
          node --check scripts/visual_smoke.mjs
          node --check scripts/recruiter_surface_smoke.mjs
          node --check scripts/accessibility_smoke.mjs
      - name: Install browser and accessibility dependencies
        run: |
          npm install --no-save playwright@1.54.2 @axe-core/playwright@4.12.1
          npx playwright install --with-deps chromium
      - name: Run full portfolio browser, recruiter UX and accessibility smoke
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ >/dev/null
          node scripts/visual_smoke.mjs http://127.0.0.1:8000 artifacts/visual
          node scripts/recruiter_surface_smoke.mjs http://127.0.0.1:8000
          node scripts/accessibility_smoke.mjs http://127.0.0.1:8000
      - name: Upload audited resumes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audited-resumes-${{ github.run_id }}
          path: assets/cv/*.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Upload full visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: portfolio-visual-qa-${{ github.run_id }}
          path: artifacts/visual/
          if-no-files-found: warn
          retention-days: 14
      - name: Build clean Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          rm -rf .site
          mkdir .site
          cp -r index.html 404.html assets cases competencias en css js robots.txt sitemap.xml .nojekyll .site/
          RELEASE_TOKEN="${GITHUB_SHA:0:12}"
          python scripts/version_resume_links.py .site "$RELEASE_TOKEN"
          printf '%s\n' "$GITHUB_SHA" > .site/build.txt
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload validated site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install live-release verification dependency
        run: python -m pip install --disable-pip-version-check pypdf==5.9.0
      - name: Confirm exact portfolio build and current resumes are live
        shell: bash
        run: |
          RELEASE_TOKEN="${GITHUB_SHA:0:12}"
          for attempt in {1..36}; do
            BUILD_SHA="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://mayconxzdev.github.io/build.txt?build=${GITHUB_SHA}&attempt=${attempt}" || true)"
            HOME_HTML="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://mayconxzdev.github.io/?build=${GITHUB_SHA}&attempt=${attempt}" || true)"
            CAREER_HTML="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://mayconxzdev.github.io/cases/carreira-pessoal/?build=${GITHUB_SHA}&attempt=${attempt}" || true)"
            PROD_HTML="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://mayconxzdev.github.io/cases/producao-operacional/?build=${GITHUB_SHA}&attempt=${attempt}" || true)"
            ISO_HTML="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://mayconxzdev.github.io/cases/central-iso/?build=${GITHUB_SHA}&attempt=${attempt}" || true)"
            SKILLS_HTML="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://mayconxzdev.github.io/competencias/?build=${GITHUB_SHA}&attempt=${attempt}" || true)"
            CAREER_IMAGE="$(curl -fsSI --max-time 20 "https://mayconxzdev.github.io/assets/evidence/carreira-product-overview.svg?build=${GITHUB_SHA}" | head -n 1 || true)"
            SOCIAL_IMAGE="$(curl -fsSI --max-time 20 "https://mayconxzdev.github.io/assets/social/og-cover.png?build=${GITHUB_SHA}" | head -n 1 || true)"

            rm -f /tmp/resume-pt.pdf /tmp/resume-en.pdf
            curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
              "https://mayconxzdev.github.io/assets/cv/Maycon_Ferreira_Analista_Automacao_IA_Integracoes.pdf?v=${RELEASE_TOKEN}&attempt=${attempt}" \
              -o /tmp/resume-pt.pdf || true
            curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
              "https://mayconxzdev.github.io/assets/cv/Maycon_Ferreira_AI_Automation_Integrations_Analyst.pdf?v=${RELEASE_TOKEN}&attempt=${attempt}" \
              -o /tmp/resume-en.pdf || true

            RESUMES_OK=false
            if [[ -s /tmp/resume-pt.pdf && -s /tmp/resume-en.pdf ]]; then
              if python scripts/verify_live_resumes.py /tmp/resume-pt.pdf /tmp/resume-en.pdf; then
                RESUMES_OK=true
              fi
            fi

            if [[ "$BUILD_SHA" == "$GITHUB_SHA" ]] \
              && grep -Fq "RESULTADOS EM USO" <<<"$HOME_HTML" \
              && grep -Fq 'data-global-chrome="2026-08"' <<<"$HOME_HTML" \
              && grep -Fq 'class="archive-expand"' <<<"$HOME_HTML" \
              && grep -Fq "Maycon_Ferreira_Analista_Automacao_IA_Integracoes.pdf?v=${RELEASE_TOKEN}" <<<"$HOME_HTML" \
              && grep -Fq 'Automation Business Analyst Professional Training' <<<"$HOME_HTML" \
              && grep -Fq 'data-global-chrome="2026-08"' <<<"$CAREER_HTML" \
              && grep -Fq 'class="case-page"' <<<"$CAREER_HTML" \
              && grep -Fq '>Competências<' <<<"$CAREER_HTML" \
              && grep -Fq 'data-global-chrome="2026-08"' <<<"$PROD_HTML" \
              && grep -Fq '>Competências<' <<<"$PROD_HTML" \
              && grep -Fq 'Produção<br>Operacional' <<<"$PROD_HTML" \
              && grep -Fq 'data-global-chrome="2026-08"' <<<"$ISO_HTML" \
              && grep -Fq 'class="case-page"' <<<"$ISO_HTML" \
              && grep -Fq 'RASTREABILIDADE, CONFIABILIDADE E SEGURANÇA' <<<"$SKILLS_HTML" \
              && ! grep -Fq 'RASTREABILIDADE, RASTREABILIDADE' <<<"$SKILLS_HTML" \
              && grep -Fq "MAPA VISUAL SANITIZADO" <<<"$CAREER_HTML" \
              && grep -Fq "200" <<<"$CAREER_IMAGE" \
              && grep -Fq "200" <<<"$SOCIAL_IMAGE" \
              && [[ "$RESUMES_OK" == true ]]; then
              echo "Published Pages SHA, recruiter surfaces and both live resumes match this exact build."
              exit 0
            fi
            echo "Published release is not fully current yet (attempt ${attempt}/36; live build=${BUILD_SHA:-missing}; expected=${GITHUB_SHA})."
            sleep 10
          done
          echo "Pages deployed, but exact build/resume verification did not converge within the verification window."
          exit 1
