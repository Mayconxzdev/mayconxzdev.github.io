name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install resume dependencies
        run: python -m pip install --disable-pip-version-check reportlab==4.4.9 pypdf==5.9.0 pymupdf==1.26.7
      - name: Validate Python sources
        run: python -m compileall -q scripts
      - name: Generate ATS resumes
        run: python scripts/generate_resumes.py
      - name: Normalize verified portfolio facts and positioning
        run: |
          python scripts/normalize_portfolio_content.py
          python scripts/normalize_canonical_routes.py
          python scripts/apply_verified_career_facts.py
      - name: Validate resume content and parser compatibility
        run: python scripts/validate_resumes.py
      - name: Validate rendered resume layout
        run: python scripts/validate_resume_visual.py
      - name: Validate portfolio content, links and hygiene
        run: python scripts/validate_site.py
      - name: Validate JavaScript syntax
        run: node --check js/site.js && node --check scripts/visual_smoke.mjs
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run portfolio browser and visual smoke
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ >/dev/null
          PORTFOLIO_BASE_URL=http://127.0.0.1:8000 node scripts/visual_smoke.mjs
      - name: Upload audited resumes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-resumes-${{ github.run_id }}
          path: assets/cv/*.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa-${{ github.run_id }}
          path: artifacts/visual/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit generated and verified artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TRACKED=(
            assets/cv/*.pdf
            index.html
            en/index.html
            competencias/index.html
            en/skills/index.html
            cases/mala-direta/index.html
            en/cases/mala-direta/index.html
            cases/producao-operacional/index.html
            en/cases/producao-operacional/index.html
            cases/catalogo-operacional-compras/index.html
            en/cases/operational-procurement-catalog/index.html
            cases/postagem-redes/index.html
            en/cases/postagem-redes/index.html
            cases/portal/index.html
            en/cases/portal/index.html
            cases/compass/index.html
            en/cases/compass/index.html
            cases/helpdesk/index.html
            en/cases/helpdesk/index.html
            cases/compass-automation/index.html
            en/cases/compass-automation/index.html
            cases/compras-vesper/index.html
            en/cases/compras-vesper/index.html
            sitemap.xml
          )
          if ! git diff --quiet -- "${TRACKED[@]}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${TRACKED[@]}"
            git commit -m "chore: publish verified career facts and audited resumes [skip ci]"
            git push
          fi
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload validated site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
