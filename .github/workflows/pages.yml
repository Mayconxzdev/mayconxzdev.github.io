name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install resume dependencies
        run: python -m pip install --disable-pip-version-check reportlab==4.4.9 pypdf==5.9.0 pymupdf==1.26.7
      - name: Validate source syntax
        run: python -m compileall -q scripts
      - name: Generate current resumes
        run: python scripts/generate_resumes.py
      - name: Reconcile public case facts and voice
        run: |
          python scripts/reconcile_public_cases.py
          python scripts/rewrite_public_voice.py
          python scripts/final_quality_patch.py
      - name: Validate resume content and ATS parsing
        run: python scripts/validate_resumes.py
      - name: Validate rendered resume layout
        run: python scripts/validate_resume_visual.py
      - name: Validate portfolio structure and links
        run: python scripts/validate_site.py
      - name: Validate natural public voice and current claims
        run: python scripts/validate_public_voice.py
      - name: Validate JavaScript syntax
        run: node --check js/site.js && node --check scripts/visual_smoke.mjs
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run portfolio browser and visual smoke
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ >/dev/null
          PORTFOLIO_BASE_URL=http://127.0.0.1:8000 node scripts/visual_smoke.mjs
      - name: Upload audited resumes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-resumes-${{ github.run_id }}
          path: assets/cv/*.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa-${{ github.run_id }}
          path: artifacts/visual/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit generated public artifacts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add assets/cv/*.pdf sitemap.xml
          find . -type f -name 'index.html' -not -path './artifacts/*' -print0 | xargs -0 git add --
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: publish current portfolio content and resumes [skip ci]"
            git push
          fi
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload validated site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm current portfolio is live
        shell: bash
        run: |
          for attempt in {1..30}; do
            HTML="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://mayconxzdev.github.io/?build=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if grep -Fq "RESULTADOS EM USO" <<<"$HTML" \
              && grep -Fq "base de 1.020 contatos" <<<"$HTML" \
              && grep -Fq "10+ computadores e 1 TV" <<<"$HTML" \
              && ! grep -Fq "PROVAS EM CONTEXTO" <<<"$HTML" \
              && ! grep -Fq "3h → 5min" <<<"$HTML" \
              && ! grep -Fq "Portal Vesper" <<<"$HTML"; then
              echo "Published portfolio matches the current source."
              exit 0
            fi
            echo "Published content is not current yet (attempt ${attempt}/30)."
            sleep 10
          done
          echo "The Pages deployment completed, but the public URL did not expose the current portfolio within the verification window."
          exit 1
