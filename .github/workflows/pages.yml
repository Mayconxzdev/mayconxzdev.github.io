name: Laboratorio Vivo - validar e publicar Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: laboratorio-vivo-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lab-src/package-lock.json
      - name: Instalar dependencias fixadas
        run: npm ci --prefix lab-src --no-audit --no-fund
      - name: Gerar paginas estaticas
        run: npm run build --prefix lab-src
      - name: Conferir projeto, status e curriculos
        run: npm run audit --prefix lab-src
      - name: Instalar Chromium
        run: cd lab-src && npx playwright install --with-deps chromium
      - name: Testar navegacao em quatro larguras
        env:
          CI: 'true'
        shell: bash
        run: |
          npm run preview --prefix lab-src -- --host 127.0.0.1 --port 4190 --strictPort >/tmp/lab-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4190/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4190/ >/dev/null
          node lab-src/scripts/audit-browser.cjs
      - name: Salvar capturas e QA automatizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio-vivo-qa
          path: lab-src/evidence/browser/
          if-no-files-found: warn
          retention-days: 14
      - name: Marcar revisao exata
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: printf '%s\n' "$GITHUB_SHA" > lab-src/dist/build.txt
      - name: Configurar GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Empacotar site compilado
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: lab-src/dist/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Confirmar revisao exata, case e curriculo geral
        shell: bash
        run: |
          ROOT="https://mayconxzdev.github.io"
          for attempt in {1..24}; do
            LIVE_SHA="$(curl -fsSL --max-time 15 "$ROOT/build.txt?try=$attempt" || true)"
            HOME="$(curl -fsSL --max-time 15 "$ROOT/?try=$attempt" || true)"
            CV_STATUS="$(curl -sSL --max-time 15 -o /dev/null -w '%{http_code}' "$ROOT/assets/cv/Maycon_Ferreira_Solucoes_Digitais_Automacao_IA.pdf" || true)"
            CASE_STATUS="$(curl -sSL --max-time 15 -o /dev/null -w '%{http_code}' "$ROOT/projetos/producao-operacional/" || true)"
            LEGACY_STATUS="$(curl -sSL --max-time 15 -o /dev/null -w '%{http_code}' "$ROOT/cases/producao-operacional/" || true)"
            if [[ "$LIVE_SHA" == "$GITHUB_SHA" ]] \
              && grep -Fq 'Laboratório Vivo' <<<"$HOME" \
              && [[ "$CV_STATUS" == '200' ]] \
              && [[ "$CASE_STATUS" == '200' ]] \
              && [[ "$LEGACY_STATUS" == '200' ]]; then
              echo "Release verificado: SHA, case, PDF e URL legada."
              exit 0
            fi
            sleep 10
          done
          echo "Publicacao nao convergiu."
          exit 1