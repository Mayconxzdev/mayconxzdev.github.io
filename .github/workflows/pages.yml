name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check "reportlab>=4.2,<5" "pypdf>=5,<7"
      - name: Generate current one-page resumes
        run: python scripts/generate_resumes.py
      - name: Validate resume structure, text and links
        run: python scripts/validate_resumes.py
      - name: Validate static pages and references
        run: python scripts/validate_site.py
      - name: Validate Python and JavaScript syntax
        run: |
          python -m py_compile scripts/generate_resumes.py scripts/validate_resumes.py scripts/validate_site.py
          node --check js/site.js
      - name: Commit generated resumes to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- assets/cv; then
            echo "Generated resumes already match the repository."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cv/Maycon_Ferreira_Analista_Automacao_IA_Integracoes.pdf
          git add assets/cv/Maycon_Ferreira_AI_Automation_Integrations_Analyst.pdf
          git commit -m "chore: refresh generated resumes [skip ci]"
          git push
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload generated site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
