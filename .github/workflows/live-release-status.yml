name: Publish Pages live status

on:
  workflow_run:
    workflows: ["Validate and deploy GitHub Pages"]
    types: [completed]

permissions:
  statuses: write
  contents: read

jobs:
  publish-status:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Publish pages/live-release status on deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$CONCLUSION" == "success" ]]; then
            STATE="success"
            DESCRIPTION="Pages, exact build SHA and live PT/EN resumes verified"
          else
            STATE="failure"
            DESCRIPTION="Pages live-release verification did not pass"
          fi

          PAYLOAD="$(python - <<'PY'
          import json, os
          print(json.dumps({
              'state': os.environ['STATE'],
              'context': 'pages/live-release',
              'description': os.environ['DESCRIPTION'],
              'target_url': os.environ['RUN_URL'],
          }))
          PY
          )"

          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -d "$PAYLOAD"
        env:
          STATE: ${{ github.event.workflow_run.conclusion == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ github.event.workflow_run.conclusion == 'success' && 'Pages, exact build SHA and live PT/EN resumes verified' || 'Pages live-release verification did not pass' }}
